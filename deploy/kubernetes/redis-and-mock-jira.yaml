apiVersion: apps/v1
kind: Deployment
metadata:
  name: pii-workflow-redis
  namespace: ai-workflow
  labels:
    app.kubernetes.io/name: pii-workflow-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pii-workflow-redis
  template:
    metadata:
      labels:
        app: pii-workflow-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pii-workflow-redis
  namespace: ai-workflow
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: pii-workflow-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pii-workflow-mock-jira
  namespace: ai-workflow
  labels:
    app.kubernetes.io/name: pii-workflow-mock-jira
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pii-workflow-mock-jira
  template:
    metadata:
      labels:
        app: pii-workflow-mock-jira
    spec:
      containers:
        - name: mock-jira
          image: ghcr.io/your-org/agentic-pii-masking-workflow-mock:latest
          command: ["python", "src/mock_server/mock_jira_app.py"]
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pii-workflow-mock-jira
  namespace: ai-workflow
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: pii-workflow-mock-jira
