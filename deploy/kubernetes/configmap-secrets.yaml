apiVersion: v1
kind: ConfigMap
metadata:
  name: pii-workflow-config
  namespace: ai-workflow
  labels:
    app.kubernetes.io/name: agentic-pii-masking-workflow
    app.kubernetes.io/part-of: ai-infrastructure
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  REDIS_URL: "redis://pii-workflow-redis:6379/0"
  STREAM_NAME: "email_ingestion_stream"
  GROUP_NAME: "agentic_masking_workers"
  DLQ_STREAM_NAME: "email_dlq_stream"
  MAX_CONCURRENT_TASKS: "16"
  ENABLE_CASCADE_ROUTING: "true"
  KMS_PROVIDER: "aws_kms"
  AWS_KMS_KEY_ARN: "arn:aws:kms:us-east-1:123456789012:key/mrk-pii-vault-master-kek"
  AWS_REGION: "us-east-1"
  ENABLE_HITL_FOR_SECURITY_INCIDENTS: "true"
  HITL_CONFIDENCE_THRESHOLD: "0.90"
  DOWNSTREAM_API_BASE_URL: "http://pii-workflow-mock-jira:8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: pii-workflow-secrets
  namespace: ai-workflow
type: Opaque
stringData:
  DOWNSTREAM_API_TOKEN: "mock_jira_token_secure_9921"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  TYPESAFE_API_KEY: ""
  VAULT_MASTER_KEY: "dGhpcy1pcy1hLXNlY3VyZS0zMi1ieXRlLXZhdWx0LWtleSE="
