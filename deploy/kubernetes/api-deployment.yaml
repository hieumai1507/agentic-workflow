apiVersion: apps/v1
kind: Deployment
metadata:
  name: pii-workflow-api
  namespace: ai-workflow
  labels:
    app.kubernetes.io/name: pii-workflow-api
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pii-workflow-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pii-workflow-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/agentic-pii-masking-workflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: pii-workflow-config
            - secretRef:
                name: pii-workflow-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pii-workflow-api-service
  namespace: ai-workflow
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: pii-workflow-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pii-workflow-ingress
  namespace: ai-workflow
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - pii-gateway.internal.enterprise.com
      secretName: pii-gateway-tls
  rules:
    - host: pii-gateway.internal.enterprise.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pii-workflow-api-service
                port:
                  number: 8000
